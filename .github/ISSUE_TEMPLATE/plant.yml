name: Plant something
description: Leave a little life in Akhil's community garden.
title: "garden: plant"
body:
  - type: markdown
    attributes:
      value: |
        Pick an empty plot and a seed. Submit this issue to plant it.
        One plant per person per UTC day. If someone takes your plot first, choose another empty plot.
        The garden records your public GitHub username as the caretaker.
  - type: input
    id: plot
    attributes:
      label: Plot
      description: Use an empty plot from A1 through F8. The profile link fills this in for you.
      placeholder: A1
    validations:
      required: true
  - type: dropdown
    id: seed
    attributes:
      label: Seed
      options:
        - Oak
        - Pine
        - Sunflower
        - Tulip
        - Mushroom
        - Wheat
    validations:
      required: true
